[project]
name = "genesis"
version = "0.1.0"
description = "Origin registry for photographers — PRNU sensor fingerprints on ERC-7053"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["fingerprint", "ingest", "scoring", "console"]
python_files = ["validate_*.py", "test_*.py"]

[tool.coverage.run]
# Fixture generators: dev-only, run by hand to regenerate committed
# fixtures, never imported by the product. Their output is what the tests
# check (rust/genesis-prnu/tests/fixtures/), so counting their own lines
# would only measure whether anyone regenerated fixtures in CI.
omit = ["*/dump_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
