# Build the Genesis desktop app for every platform and attach the installers
# to a draft GitHub release. Draft on purpose: a person publishes it.
#
# The Python imaging core is embedded (PyO3), not a sidecar process --
# desktop/src-tauri/src/lib.rs -- so there is nothing to spawn at runtime,
# only a Python runtime to bundle at build time (bundle-python.sh). Proven
# on macOS: 2s cold start, a real CR3 decoded through the bundled runtime
# (17 Sept). The Linux and Windows steps below follow the same script and
# have not been run; the first real run here is their actual test.
#
# Run it from the Actions tab (workflow_dispatch), or push a tag such as
# `desktop-v0.1.0`.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest     # Apple silicon
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: astral-sh/setup-uv@v3

      # The app verifies with core/ (docs/shared-verify-plan.md), whose two
      # WASM modules console-ui's build compiles first: wasm-pack for the
      # Rust core, Emscripten for libjpeg-turbo.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - uses: mymindstorm/setup-emsdk@v14

      - name: Console UI dependencies
        run: |
          npm ci --prefix core
          npm ci --prefix console-ui

      - name: Bundle the Python runtime (fetched + populated, not built)
        shell: bash
        run: desktop/scripts/bundle-python.sh

      # PyO3 links against Python at compile time (desktop/src-tauri/.cargo/
      # config.toml); actions/setup-python's own `python3.12` is fine on
      # macOS and Linux, but does not exist under that name on Windows.
      - name: Point PyO3 at this runner's Python (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYO3_PYTHON=python" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: Genesis desktop v__VERSION__
          releaseBody: |
            Unsigned builds. macOS: System Settings > Privacy & Security > Open Anyway the first time.
            Windows: choose "More info" then "Run anyway" on the SmartScreen prompt.
          releaseDraft: true
          prerelease: true

  # Publish the draft once every platform has built: installers renamed to
  # genesis-<version>-<os>-<arch>.<ext>, a SHA256SUMS.txt, then a normal
  # release, so the landing page's releases/latest link finds it. Runs even
  # if one platform failed, publishing whatever did build.
  publish:
    needs: build
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Rename installers, add checksums, publish
        shell: bash
        run: |
          set -euo pipefail
          V="${TAG#desktop-v}"
          mkdir dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -la
          for f in *; do
            case "$f" in
              *.dmg)          new="genesis-$V-macos-aarch64.dmg" ;;
              *-setup.exe)    new="genesis-$V-windows-x64-setup.exe" ;;
              *.msi)          new="genesis-$V-windows-x64.msi" ;;
              *.AppImage)     new="genesis-$V-linux-x86_64.AppImage" ;;
              *.deb)          new="genesis-$V-linux-x86_64.deb" ;;
              *.rpm)          new="genesis-$V-linux-x86_64.rpm" ;;
              *)              new="" ;;   # updater archives and signatures are not offered
            esac
            gh release delete-asset "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --yes
            if [ -n "$new" ]; then mv "$f" "$new"; else rm "$f"; fi
          done
          sha256sum genesis-* > SHA256SUMS.txt
          gh release upload "$TAG" genesis-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          {
            echo "## Install"
            echo
            echo "- **macOS (Apple silicon):** open the .dmg and drag Genesis into Applications. The app is not notarized yet, so macOS says it \"could not verify\" Genesis the first time. Click Done, then open System Settings > Privacy & Security and click Open Anyway next to Genesis. Or run: xattr -dr com.apple.quarantine /Applications/Genesis.app"
            echo "- **Windows:** run the -setup.exe (or the .msi). On the SmartScreen prompt choose More info, then Run anyway."
            echo "- **Linux:** the .AppImage runs as is (chmod +x first); .deb and .rpm install system-wide."
            echo
            echo "Check a download against SHA256SUMS.txt: shasum -a 256 -c SHA256SUMS.txt --ignore-missing"
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest --notes-file notes.md
