# Tests and coverage for every part of the repo, on every push and PR.
# Each job writes its numbers to the run summary.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest-cov
      - name: pytest with coverage
        # The floor stops coverage sliding; raise it as it rises.
        # `shell: bash` runs with pipefail, so a failure is not masked by tee.
        shell: bash
        run: >
          python -m pytest -q
          --cov=fingerprint --cov=ingest --cov=scoring --cov=console
          --cov-report=term --cov-report=xml --cov-fail-under=75
          | tee pytest.txt
      - name: Summary
        if: always()
        run: |
          echo '### Python' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(TOTAL|[0-9]+ passed)' pytest.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Dependencies (lib/ is not committed; versions match the local tree)
        run: |
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
      - run: forge build --sizes
      - name: Tests, with fuzzing at 10,000 runs
        run: forge test -vv
        env:
          FOUNDRY_FUZZ_RUNS: "10000"
      - name: Coverage (Registry must stay at 100% of lines)
        run: |
          forge coverage --report summary --report lcov | tee coverage.txt
          line=$(grep 'src/Registry.sol' coverage.txt)
          echo "$line"
          echo "$line" | grep -q '| 100.00% ([0-9]*/[0-9]*) *|' || { echo "Registry line coverage dropped below 100%"; exit 1; }
      - name: Summary
        if: always()
        run: |
          echo '### Contracts' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'File|Registry.sol|Total' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-lcov
          path: contracts/lcov.info

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Dependencies
        run: |
          git clone --depth 1 --branch v1.16.2 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
          git clone --depth 1 --branch v5.7.0 https://github.com/OpenZeppelin/openzeppelin-contracts contracts/lib/openzeppelin-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install slither-analyzer
      # Any new finding fails the job. `timestamp` and `incorrect-equality`
      # are excluded: registerImage stores block.timestamp in its record, so
      # slither flags every comparison on it, though none compares a time.
      # Registry.sol cannot carry slither-disable comments: it must stay
      # byte-identical to the source verified on Basescan.
      - name: Slither
        working-directory: contracts
        run: slither . --filter-paths "lib/|test/|script/" --exclude timestamp,incorrect-equality --fail-low

  subgraph:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: subgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx graph codegen
      - run: npx graph build
      - run: npx graph test

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The Rust core, core/ (shared verification), and the three WASM frontends
  # (verify/, console-ui/, score/). core's tests are the only JPEG hash
  # parity check (the Rust crate does not link libjpeg-turbo).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: genesis-prnu tests (PRNU parity, hashing parity)
        run: cargo test -p genesis-prnu
      - name: core -- the shared verification, WASM, types, tests
        working-directory: core
        run: |
          npm ci
          npm run wasm
          npx tsc --noEmit -p .
          npm test
      - name: verify -- build, types
        working-directory: verify
        run: |
          npm ci
          npm run build
          npx tsc --noEmit -p .
      - name: console-ui -- the desktop app's frontend, on core
        working-directory: console-ui
        run: |
          npm ci
          npm run build
          npx tsc --noEmit -p .
      - name: score -- build, types
        working-directory: score
        run: |
          npm ci
          npm run build
          npx tsc --noEmit -p .
      - name: mcp -- verify_image_file on core's WASM, hash parity
        working-directory: mcp
        run: |
          npm ci
          GENESIS_REQUIRE_CORE=1 npm run build
          npm test

  # The desktop app's bundled Python must hash photos like the verify page.
  # The JPEG hash depends on Pillow's per-platform libjpeg-turbo, so check
  # each shipped platform. (Linux: the python job's pytest.)
  hash-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ingest.dump_hash_fixtures --check

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # PyO3 links against Python at compile time.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # console-ui is built and tested in the wasm job; tauri-build only
      # checks that frontendDist exists, so an empty one satisfies the lint.
      - name: Placeholder frontend (built for real in the wasm job)
        run: mkdir -p console-ui/dist
      # tauri-build checks bundle.resources paths exist even for clippy;
      # empty directories satisfy this lint pass (desktop.yml builds for real).
      - name: Placeholder resources (tauri-build only checks they exist)
        run: mkdir -p desktop/src-tauri/resources/app-src desktop/src-tauri/resources/python-runtime
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
