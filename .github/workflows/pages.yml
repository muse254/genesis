# Publishes the static site to GitHub Pages: the landing page at the root
# (site/, no build), plus three Vite builds at /verify/, /dashboard/ and
# /score/ with a relative base so they work nested.
#
# Everything is client-side (GitHub Releases API, chain and subgraph reads,
# WASM hashing and scoring), so none of them needs a server.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "verify/**"
      - "dashboard/**"
      - "score/**"
      - "core/**"
      - "rust/**"
      - "ingest/hashing.py"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - uses: mymindstorm/setup-emsdk@v14

      # Last gate before deploy: core/'s hashes against Python's fixtures,
      # JPEG included. A mismatch would make every live JPEG "no record".
      - name: Shared verification (core)
        working-directory: core
        run: |
          npm ci
          npm run wasm
          npm test

      - name: Verify page
        working-directory: verify
        # Public config only: it all has to be readable by the browser.
        # The Base mainnet registry 1.0.0 (README, "Deployments").
        env:
          VITE_RPC_URL: https://mainnet.base.org
          VITE_REGISTRY_ADDRESS: "0xBa5Ea549c9e1414C14038dB050e0caCB4f9E48cB"
          VITE_CHAIN: base
          VITE_SUBGRAPH_URL: https://api.studio.thegraph.com/query/1758974/genesis/v1.0.0-base
          VITE_EXPLORER_URL: https://basescan.org
        # `npm run build` builds core's two WASM modules first (prebuild).
        run: |
          npm ci
          npm run build
          npx tsc --noEmit -p .

      - name: Dashboard
        working-directory: dashboard
        env:
          VITE_SUBGRAPH_URL: https://api.studio.thegraph.com/query/1758974/genesis/v1.0.0-base
          VITE_EXPLORER_URL: https://basescan.org
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build

      - name: Score page
        working-directory: score
        # No config: scoring is client-side on local files. `prebuild` runs
        # wasm-pack on rust/genesis-prnu-wasm before tsc, which needs its output.
        run: |
          npm ci
          npm run build
          npx tsc --noEmit -p .

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/verify
          cp -r verify/dist/. _site/verify/
          mkdir -p _site/dashboard
          cp -r dashboard/dist/. _site/dashboard/
          mkdir -p _site/score
          cp -r score/dist/. _site/score/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
