# Publishes the static site to GitHub Pages: the landing/download page at
# the root (site/, no build step), the verify SPA at /verify/, the
# dashboard at /dashboard/, and the local scoring page at /score/ -- three
# Vite builds (verify/dashboard/score), all with a relative base (their
# vite.config.ts) so they work nested at that depth.
#
# Everything here is static: the landing page reads GitHub's Releases API
# client-side (site/app.js), the verify page hashes the photo and reads the
# chain client-side (verify/, on core/ -- the verification it shares with
# the desktop app; JPEG decoding is libjpeg-turbo built with Emscripten),
# the dashboard reads the subgraph client-side (dashboard/src/main.ts), and
# the score page runs a WASM module compiled
# from rust/genesis-prnu-wasm entirely in the browser (score/src/main.ts,
# docs/wasm-scoring-plan.md Phase 5) -- none of them need a server of
# their own, so all four fit on Pages.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "verify/**"
      - "dashboard/**"
      - "score/**"
      - "core/**"
      - "rust/**"
      - "ingest/hashing.py"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - uses: mymindstorm/setup-emsdk@v14

      # core/'s tests check the hashes against Python's committed fixtures,
      # JPEG included, as a last gate before deploy: a mismatch would turn
      # every JPEG on the live page into "no record". (ci.yml runs the same
      # on every PR.)
      - name: Shared verification (core)
        working-directory: core
        run: |
          npm ci
          npm run wasm
          npm test

      - name: Verify page
        working-directory: verify
        # Public config only (an RPC URL, a contract address, a subgraph
        # URL) -- nothing here is a secret, and none of it can be, since it
        # all has to be readable by a browser that already fetched this
        # page. The Base mainnet registry 1.0.0 (README, "Deployments"),
        # deployed 12 Oct 2026. The Base Sepolia rehearsal registry and
        # its subgraph stay readable, but the page no longer points there.
        env:
          VITE_RPC_URL: https://mainnet.base.org
          VITE_REGISTRY_ADDRESS: "0xBa5Ea549c9e1414C14038dB050e0caCB4f9E48cB"
          VITE_CHAIN: base
          VITE_SUBGRAPH_URL: https://api.studio.thegraph.com/query/1758974/genesis/v1.0.0-base
          VITE_EXPLORER_URL: https://basescan.org
        # `npm run build` builds core's two WASM modules first (prebuild).
        run: |
          npm ci
          npm run build
          npx tsc --noEmit -p .

      - name: Dashboard
        working-directory: dashboard
        env:
          VITE_SUBGRAPH_URL: https://api.studio.thegraph.com/query/1758974/genesis/v1.0.0-base
          VITE_EXPLORER_URL: https://basescan.org
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run build

      - name: Score page
        working-directory: score
        # No secrets or env config here (unlike verify/dashboard): scoring
        # is entirely client-side against files the visitor picks locally,
        # so there's nothing for this page to be configured with. `npm run
        # build`'s `prebuild` script runs `wasm-pack build` against
        # rust/genesis-prnu-wasm (see score/README.md) before `vite build`,
        # so it goes before tsc, which needs that output to resolve imports.
        run: |
          npm ci
          npm run build
          npx tsc --noEmit -p .

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/verify
          cp -r verify/dist/. _site/verify/
          mkdir -p _site/dashboard
          cp -r dashboard/dist/. _site/dashboard/
          mkdir -p _site/score
          cp -r score/dist/. _site/score/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
