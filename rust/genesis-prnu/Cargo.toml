[package]
name = "genesis-prnu"
version = "0.1.0"
edition = "2021"
description = "PRNU sensor-fingerprint scoring core (wavelet Wiener denoiser, correlation, PCE) -- a Rust port of fingerprint/prnu.py's scoring path. See docs/wasm-scoring-plan.md."
publish = false

[lib]
name = "genesis_prnu"
path = "src/lib.rs"

[dependencies]
ndarray = "0.16"

[dev-dependencies]
ndarray-npy = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
