[package]
name = "genesis-prnu-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper around genesis-prnu's scoring core: score(image_bytes, k_npz_bytes) -> PCE. K bytes never leave this call -- see docs/wasm-scoring-plan.md Phase 5 and docs/security.md 'Where K lives'."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
genesis-prnu = { path = "../genesis-prnu" }
wasm-bindgen = "0.2"
js-sys = "0.3"
ndarray = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
