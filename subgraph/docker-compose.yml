# A local Graph stack, so the subgraph can be run against real events before
# anything touches a testnet. anvil must already be listening on 8545.
#
#   anvil &
#   docker compose -f subgraph/docker-compose.yml up -d
#   contracts/script/local-e2e.sh data/references/r10.npz frame.CR3
#   cd subgraph && npx graph create --node http://localhost:8020 genesis
#                  npx graph deploy --node http://localhost:8020 \
#                    --ipfs http://localhost:5001 genesis --version-label v0
services:
  graph-node:
    image: graphprotocol/graph-node:v0.35.1
    ports: ["8000:8000", "8020:8020", "8030:8030"]
    depends_on: [ipfs, postgres]
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      # host.docker.internal reaches anvil on the host from inside the container.
      ethereum: "anvil:http://host.docker.internal:8545"
      GRAPH_LOG: info
    extra_hosts: ["host.docker.internal:host-gateway"]
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports: ["5001:5001"]
  postgres:
    image: postgres:14
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
