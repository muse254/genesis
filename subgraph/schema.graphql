type Body @entity {
  id: Bytes!
  owner: Bytes!
  "Keyed commitment to make, model and serial; zero when none was committed"
  bodyCommitment: Bytes!
  fingerprintCommitment: Bytes!
  revoked: Boolean!
  registeredAt: BigInt!
  images: [Image!]! @derivedFrom(field: "body")
}

type Image @entity {
  id: Bytes!
  "SHA-256 of pixel data -- exact identity"
  imageHash: Bytes!
  "Survives re-encode -- the branch that finds images already in the world"
  perceptualHash: Bytes!
  body: Body!
  modificationLevel: Int!
  "Null for originals; otherwise the edit graph"
  parent: Image
  derivatives: [Image!]! @derivedFrom(field: "parent")
  metadataHmac: Bytes!
  pceScore: BigInt!
  registeredAt: BigInt!
  session: Session
}

"""
One ERC-7053 commit. The standard indexes assertions and explicitly declines
to validate what is behind them, so this is kept apart from Image: an indexer
following only the standard sees the same log without inheriting our opinion
about what the commit data means.
"""
type CommitLog @entity(immutable: true) {
  id: Bytes!
  """
  The registry epoch this commit was made in.

  Commits are events, and a reset cannot unhappen an event -- on chain the
  `Commit` log stays forever too, while the queryable `commitLogs` mapping is
  epoch-scoped and cleared. So these entities survive a reset by design, and
  carry the epoch rather than being deleted. Filter on it to see only the
  current registry: `commitLogs(where: { epoch: ... })`.

  They are also `immutable`, which is what makes deleting them impossible
  rather than merely wrong: `store.remove` on an immutable entity is a no-op,
  so a handler that tried would silently do nothing.
  """
  epoch: BigInt!
  recorder: Bytes!
  assetCid: String!
  commitData: String!
  "Set when the CID is the genesis: URI minted by ingest/record.py"
  image: Image
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Session @entity {
  id: Bytes!
  merkleRoot: Bytes!
  frameCount: Int!
  committedAt: BigInt!
}

"""
What a reset has to clear.

The registry can be wiped on a testnet (`Registry.resetAll`), and an index
that outlived the chain would answer for records that no longer exist. Graph
mappings cannot enumerate entities, so the ids are tracked as they are written
and walked on reset. Singleton, id "genesis".
"""
type RegistryState @entity {
  id: String!
  "Bumped by every RegistryReset. Matches Registry.epoch()."
  epoch: BigInt!
  "True when the registry admits it can be wiped, so a reader can discount its dates."
  resettable: Boolean!
  bodyIds: [Bytes!]!
  imageIds: [Bytes!]!
  sessionIds: [Bytes!]!
  lastResetAt: BigInt
}
