specVersion: 0.0.5
description: >-
  Indexes camera-body enrolments and image registrations from the
  Genesis Registry, so an image can be resolved to its record.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Registry
    network: sepolia
    source:
      address: "0xd1bbDB8A6BfD25563d2e6444fA41E4C5230Ed3C9"
      abi: Registry
      # The deploy block. Zero here means indexing from genesis:
      # hours of work to find nothing.
      startBlock: 11694580
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/registry.ts
      entities:
        - Body
        - Image
        - Session
        - RegistryState
      abis:
        - name: Registry
          file: ./abis/Registry.json
      eventHandlers:
        - event: BodyRegistered(indexed bytes32,indexed address,bytes32)
          handler: handleBodyRegistered
        - event: BodyRevoked(indexed bytes32)
          handler: handleBodyRevoked
        - event: ImageRegistered(indexed bytes32,indexed bytes32,uint32)
          handler: handleImageRegistered
        - event: SessionCommitted(indexed bytes32,bytes32,uint32)
          handler: handleSessionCommitted
        - event: Commit(indexed address,string,string)
          handler: handleCommit
        - event: RegistryReset(indexed uint64,indexed uint64,indexed address)
          handler: handleRegistryReset
