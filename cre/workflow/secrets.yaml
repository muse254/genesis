# ==========================================================================
# K, one Vault secret per CFA plane.
# ==========================================================================
# Split per plane rather than held as one blob because the CLI passes secret
# values to the compiler as process arguments, and ARG_MAX is 1,048,576 on
# macOS. Measured: three 400 kB secrets fail to simulate with "argument list
# too long"; three 200 kB ones do not.
#
# The values are written by `cre/backend.py` into a gitignored .env for the
# length of one run and deleted after. They are a cropped, quantised K — but
# they are still K, and K never leaves the machine.
secretsNames:
    K0:
        - SECRET_K0
    K1:
        - SECRET_K1
    K2:
        - SECRET_K2
    K3:
        - SECRET_K3
